[package]
name = "phys"
version = "0.1.0"
edition = "2024"

[dependencies]
num-complex = "0.4.6"
rustfft = "6.4.0"
soapysdr = { version = "0.5.0", optional = true }
phys_macros = { path = "../phys_macros" }
tokio = { version = "^1.45", features = ["macros", "sync", "rt-multi-thread"] }
three_gpp = { path = "../three_gpp" }
ldpc = { path = "../ldpc" }
pdcch = { path = "../pdcch" }
asn = { path = "../asn" }
rasn = "0.28"
bitvec = "1.0.1"
rayon = "1.11.0"
ringbuf = "0.5"
futures = "0.3.32"
serde = { version = "1.0", features = ["derive"] }
rand_chacha = "0.10"
rand_distr = "0.6.0"

[dev-dependencies]
log = "0.4"
test-log = { version = "0.2" }
serde_json = "1.0"
criterion = { version = "0.8", features = ["html_reports"] }
rand = "0.10.0"
rand_chacha = "0.10.0-rc.1"

[features]
sdr = ["soapysdr"]
pipeline_trace = []
pipeline_debug = []
default = []

[[bench]]
name = "pdcch_polar"
harness = false